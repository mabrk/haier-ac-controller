<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>AC Control</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<header>
  <h1>AC Control</h1>
  <div class="header-right">
    <span id="status-text">Connecting…</span>
    <div id="status-dot"></div>
  </div>
</header>

<div id="error-banner"></div>

<div class="layout">

  <!-- Left column: Power + Temperature -->
  <div class="left-col">

    <div class="card" id="power-card">
      <button id="power-btn" data-action="power" title="Toggle power">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5.636 5.636a9 9 0 1 0 12.728 0M12 3v9"/>
        </svg>
      </button>
      <div id="power-label">—</div>
    </div>

    <div class="card">
      <div class="card-title">Temperature</div>
      <div class="temp-row">
        <button class="temp-btn" id="btn-minus" data-action="temp-down">−</button>
        <div class="temp-center">
          <div id="temp-display">—<span>°F</span></div>
          <div id="ambient"></div>
        </div>
        <button class="temp-btn" id="btn-plus" data-action="temp-up">+</button>
      </div>
    </div>

    <div class="card timer-card">
      <div class="timer-header" data-action="timer-toggle">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" class="timer-icon"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
        <span class="timer-lbl">Sleep timer</span>
        <span id="timer-countdown" class="timer-countdown"></span>
        <button id="timer-cancel" data-action="timer-cancel">Cancel</button>
      </div>
      <div id="timer-body" class="timer-body">
        <div class="timer-presets">
          <button class="timer-preset" data-action="timer-preset" data-min="30">30 min</button>
          <button class="timer-preset" data-action="timer-preset" data-min="60">1 hr</button>
          <button class="timer-preset" data-action="timer-preset" data-min="120">2 hr</button>
          <button class="timer-preset" data-action="timer-preset" data-min="240">4 hr</button>
        </div>
        <div class="timer-custom">
          <input type="number" id="timer-minutes" placeholder="Custom minutes" min="1" max="1440">
          <button class="timer-set" data-action="timer-set">Set</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Right column: Mode + Fan -->
  <div class="right-col">

    <div class="card">
      <div class="card-title">Mode</div>
      <div class="chip-row">
        <button class="chip" data-action="mode" data-mode="cool">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/></svg>
          Cool
        </button>
        <button class="chip" data-action="mode" data-mode="eco">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3c-4.97 5.97-3 10.5 0 12 3 1.5 5-1 5-3.5 0-2-1.5-3-3-2.5M12 3C7.03 8.97 9 13.5 12 15"/></svg>
          Eco
        </button>
        <button class="chip" data-action="mode" data-mode="fan">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z"/></svg>
          Fan
        </button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Fan Speed</div>
      <div class="chip-row">
        <button class="chip fan-chip" data-action="fan" data-fan="auto">Auto</button>
        <button class="chip fan-chip" data-action="fan" data-fan="low">Low</button>
        <button class="chip fan-chip" data-action="fan" data-fan="medium">Medium</button>
        <button class="chip fan-chip" data-action="fan" data-fan="high">High</button>
      </div>
    </div>

  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
